{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downtube - Buscador y Descargador de MP3 y MP4</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="container">
        <header>
            <h1>Downtube</h1>
            <p class="subtitle">Busca y descarga música y video de YouTube</p>
        </header>

        <!-- Selector de temas -->
        <div class="theme-selector">
            <select id="themeSelect">
                <option value="">Oscuro Neón</option>
                <option value="electric-blue" selected>Azul Eléctrico</option>
                <option value="neon-green">Verde Neón</option>
                <option value="deep-purple">Púrpura Profundo</option>
                <option value="light-minimal">Claro Minimalista</option>
            </select>
        </div>

        <!-- Selector de idioma -->
        <div class="lang-selector">
            <select id="langSelect">
                <option value="es" selected>Español</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="pt">Português</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
            </select>
        </div>

        <section class="search-section">
            <div class="search-card">
                <div class="input-group">
                    <input type="text" id="searchInput" placeholder="Busca una canción o artista..." autocomplete="off">
                    <button id="searchBtn">Buscar</button>
                </div>

                <!-- Selector de formato y calidad -->
                <div class="format-group">
                    <label for="formatSelect">Formato:</label>
                    <select id="formatSelect">
                        <option value="mp3">MP3 (audio)</option>
                        <option value="mp4">MP4 (video)</option>
                    </select>
                    <label for="qualitySelect">Calidad:</label>
                    <select id="qualitySelect">
                        <option value="192">192 kbps</option>
                        <option value="128">128 kbps</option>
                        <option value="320">320 kbps</option>
                    </select>
                </div>
            </div>

            <div id="resultsContainer" class="results-container hidden">
                <h3>Resultados</h3>
                <ul id="resultsList"></ul>
            </div>
        </section>

        <section class="download-section hidden" id="downloadSection">
            <div class="download-card">
                <div id="downloadInfo"></div>
                <div class="progress-container hidden" id="progressContainer">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p id="progressText">Preparando descarga...</p>
                </div>
                <div id="downloadResult" class="hidden">
                    <a id="downloadLink" class="download-btn" href="#" download>⬇ Descargar MP3</a>
                </div>
                <div id="errorMessage" class="error-message hidden"></div>
            </div>
        </section>

        <!-- Sección: Importar Playlist de Spotify -->
        <section class="spotify-section hidden" id="spotifySection">
            <div class="spotify-card">
                <div id="spotifyInfo"></div>
                <div class="spotify-input-group">
                    <input type="text" id="spotifyUrlInput" placeholder="Pega la URL de la playlist de Spotify..." autocomplete="off">
                    <button id="spotifyImportBtn">Importar Playlist</button>
                </div>
                <div id="spotifyResults" class="spotify-results hidden"></div>
                <div id="spotifySummary" class="spotify-summary hidden"></div>
                <div class="spotify-download-actions">
                    <button class="spotify-select-all" type="button">Seleccionar todo</button>
                    <button class="spotify-download-selected-btn" type="button" disabled>Descargar seleccionados</button>
                </div>
            </div>
        </section>
    </div>

    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
